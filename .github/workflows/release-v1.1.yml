name: Publish Windows v1.1
on:
  push:
    branches: [main]
    paths: ['release/v1.1.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v1.1
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download and verify official Small model
        shell: pwsh
        run: ./scripts/download-model.ps1
      - name: Build lightweight package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Build recommended package with model
        shell: pwsh
        run: ./scripts/package.ps1 -WithModel
      - name: Validate release archives
        shell: pwsh
        run: ./scripts/verify-packages.ps1
      - name: Publish v1.1 and downloadable assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $assets=@(Get-ChildItem -LiteralPath dist -File | ForEach-Object {$_.FullName})
          gh release create v1.1 @assets --target $env:GITHUB_SHA --title '深度视频桌面版 v1.1' --notes-file release/v1.1.md --latest
          if ($LASTEXITCODE -ne 0) {throw 'Release publication failed'}
